[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htof"
version = "1.2.0"
description = "Astrometric fitting of Hipparcos and Gaia intermediate astrometric data (IAD)."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "G. Mirek Brandt"},
    {name = "Daniel Michalik"},
    {name = "Gavin K. Hung"},
]
keywords = ["astronomy", "astrometry", "Gaia", "Hipparcos", "orbit fitting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "astropy>=5.1",
    "pandas>=1.5",
    "requests>=2.25",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "mock>=4.0"]
docs = ["jupyter", "matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/gmbrandt/HTOF"
Source = "https://github.com/gmbrandt/HTOF"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["htof*"]

[tool.setuptools.package-data]
htof = ["data/*.csv", "data/*.txt"]
"htof.test" = [
    "data_for_tests/**/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["htof/test"]
markers = [
    "e2e: mark a test as end-to-end",
    "integration: mark a test as integration",
]
filterwarnings = [
    "ignore::DeprecationWarning:ptemcee.*",
]

[tool.coverage.report]
omit = [
    "*/python?.?/*",
    "*__init__*",
    "*/validation/*",
    "*.ipynb",
    "htof/test/*",
]
exclude_lines = ["pragma: no cover"]
